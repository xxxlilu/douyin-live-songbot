; 离线测试配置：用假弹幕源，dry_run，不碰抖音也不碰网易云
;   python -m songbot -c config.test.ini run
[general]
room_url = https://live.douyin.com/123456789
dry_run = true
log_file = logs/songbot.log

[danmaku]
source = command
command = python tools/fake_source.py
reconnect_seconds = 2

[song]
keywords = 点歌,点一首,来一首
per_user_cooldown_seconds = 20
per_user_max_pending = 2
global_cooldown_seconds = 0
duplicate_window_seconds = 60

[netease]
executable = C:\Program Files\Netease\CloudMusic\cloudmusic.exe
