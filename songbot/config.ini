; ============================================================
; 抖音点歌 → 网易云「下一首播放」  配置文件
; 改完直接重新运行 run.ps1 即可，不用重启别的东西
; ============================================================

[general]
; 你的直播间地址。运行 Setup.bat 时会问你并自动填好；
; 也可以手动填，形如 https://live.douyin.com/123456789
room_url =

; true = 只识别和打印，不动网易云（先用来验证识别对不对）
dry_run = false

; 日志文件（相对本目录）
log_file = logs/songbot.log

[danmaku]
; 弹幕来源适配器：
;   command = 跑一个外部命令，逐行读 stdout 里的 JSON / Python dict
;   vendor  = 直接把 vendor/DouyinLiveWebFetcher 当库调用（实验性）
source = command

; source=command 时执行的命令。{room_url} 会被替换成 [general] room_url
; tools/douyin_ndjson.py 会把弹幕库的日志改道 stderr，只在 stdout 输出 JSON
command = python tools/douyin_ndjson.py {room_url}

; 弹幕连接断了以后，隔多少秒重连
reconnect_seconds = 5

[song]
; 触发词，逗号分隔
keywords = 点歌,点一首,来一首

; 歌名最长多少个字（防刷屏）
max_len = 40

; 严格模式：必须以「点歌」开头，且不能夹带「能不能 / 帮我 / 谢谢」这类聊天词
strict = false

; 是否必须带歌手（观众写「点歌 晴天 周杰伦」或「点歌 晴天 - 周杰伦」都行）
require_artist = false

; 同一个观众两次点歌至少间隔多少秒
per_user_cooldown_seconds = 15

; 同一个观众同时最多排几首
per_user_max_pending = 2

; 两首歌之间至少间隔多少秒（防止一瞬间全塞进去）
global_cooldown_seconds = 3

; 同一首歌多少秒内不重复接受
duplicate_window_seconds = 60

; 本地记录最多留多少条
max_queue = 50

[netease]
; 怎么处理点歌：
;   queue = 只写进 next5-overlay 的收件箱，由那边排队+插播（默认，推荐）
;   awoo  = 直接驱动连接器插成「下一首」（旧流程，没有排队）
;   ipc   = 老的 orpheus 窗口消息（网易云 3.1.41+ 已废弃）
;   uia   = 界面自动化兜底（需要 uiautomation）
mode = queue

; 连接器路径（mode = awoo 时才用）
connector = tools/awoo-connector/extracted/Awoo.Connector.Netease.exe

; 网易云客户端路径（只在老 ipc 模式里用来启动客户端）
executable = C:\Program Files\Netease\CloudMusic\cloudmusic.exe

; 搜索时自动补在歌名后面的词，比如填「 周杰伦」让「晴天」更容易搜到原唱
search_suffix =

; 下面几项目前只给 mode = uia 用
prefer_single_tab = true
action = 下一首播放
search_wait_seconds = 2.5

[queue]
; 点歌收件箱：一行一条 JSON，overlay 会读它
inbox = ../overlay/queue.inbox.jsonl

fallback = warn
