<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>接下来</title>
<style>
  :root{
    --bg: rgba(14,16,20,.80);
    --fg: #f3f5f8; --dim: #9aa4b2;
    --line: rgba(255,255,255,.08);
    --accent: #ffd166; --badge: rgba(255,209,102,.14);
    --warn: #ff8a80;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
             color:var(--fg); -webkit-font-smoothing:antialiased; overflow:hidden; }
  .wrap{ width:460px; }
  .toast{
    margin-bottom:8px; padding:8px 14px; border-radius:12px;
    background:linear-gradient(90deg, rgba(255,209,102,.20), rgba(255,209,102,.06));
    border:1px solid rgba(255,209,102,.35);
    font-size:13px; color:var(--accent);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card{ padding:14px 16px 10px; border-radius:16px; background:var(--bg);
         border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.35);
         backdrop-filter:blur(6px); }
  .head{ display:flex; align-items:baseline; gap:8px; padding-bottom:8px; margin-bottom:6px;
         border-bottom:1px solid var(--line); }
  .head .t{ font-size:15px; font-weight:700; letter-spacing:.5px; }
  .head .n{ font-size:11px; color:var(--dim); }
  .head .paused{ margin-left:auto; font-size:11px; color:var(--warn);
                 border:1px solid rgba(255,138,128,.35); border-radius:999px; padding:1px 8px; }
  ol{ list-style:none; }
  li{ display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); }
  li:last-child{ border-bottom:none; }
  .idx{ width:20px; flex:0 0 20px; font-size:12px; color:var(--dim); text-align:right;
        font-variant-numeric:tabular-nums; }
  .meta{ flex:1 1 auto; min-width:0; }
  .name{ font-size:17px; font-weight:600; line-height:1.25; white-space:nowrap;
         overflow:hidden; text-overflow:ellipsis; }
  .artist{ font-size:12px; color:var(--dim); line-height:1.3; margin-top:1px; white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
  .who{ flex:0 0 auto; max-width:132px; font-size:11px; color:var(--accent);
        background:var(--badge); border:1px solid rgba(255,209,102,.22);
        border-radius:999px; padding:2px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty{ padding:22px 4px; font-size:13px; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toast" id="toast" hidden></div>
  <div class="card">
    <div class="head">
      <span class="t" id="title">接下来</span>
      <span class="n" id="count"></span>
      <span class="paused" id="paused" hidden>已暂停接单</span>
    </div>
    <ol id="list"></ol>
    <div class="empty" id="empty" hidden>队列里暂时没有待播</div>
  </div>
</div>
<script>
const listEl = document.getElementById('list');
const titleEl = document.getElementById('title');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const toastEl = document.getElementById('toast');
const pausedEl = document.getElementById('paused');

let toastTimer = null;
function esc(s){ return (s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function showToast(t){
  if (!t || !t.user) return;
  toastEl.textContent = `『${t.user}』点了《${t.song}》`;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3000);
}

function render(data){
  const rows = data.rows || [];
  titleEl.textContent = data.title || '接下来';
  const total = data.total || 0;
  countEl.textContent = total > 5 ? `共 ${total} 首排队` : '';
  pausedEl.hidden = !data.paused;

  showToast(data.toast);

  if (!rows.length){
    listEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.textContent = data.synced === false ? '歌单同步中…' : '队列里暂时没有待播';
    return;
  }
  emptyEl.hidden = true;
  listEl.innerHTML = rows.map((r, i) => `
    <li>
      <span class="idx">${i + 1}</span>
      <span class="meta">
        <div class="name">${esc(r.name)}</div>
        ${r.artist ? `<div class="artist">${esc(r.artist)}</div>` : ''}
      </span>
      ${r.kind === 'request' && r.requester ? `<span class="who">${esc(r.requester)}</span>` : ''}
    </li>`).join('');
}

async function tick(){
  try{
    const resp = await fetch('/api/queue', { cache: 'no-store' });
    if (resp.ok) render(await resp.json());
  }catch(e){}
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
